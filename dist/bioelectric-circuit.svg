<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 550" role="img" aria-labelledby="t d">
<title id="t">Three conceptual membrane electrical pathways</title><desc id="d">A horizontal plasma membrane separates extracellular from intracellular space. Three distinct pathways are illustrated: ion flow through a channel, charge stored across membrane capacitance, and electron transfer across a trans-plasma-membrane system. This is a conceptual diagram without measured values.</desc>
